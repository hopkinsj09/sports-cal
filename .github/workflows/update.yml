name: Update schedule
on:
  schedule: [{cron: "17 */6 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install reportlab
      - run: python build.py
      - name: Commit if ics changed
        run: |
          git config user.name "schedule-bot"; git config user.email "bot@users.noreply.github.com"
          git add docs
          # PDF embeds an "updated" date, so only commit when the games (ics) changed
          if git diff --cached --quiet -- docs/schedule.ics; then git checkout -- docs; else git commit -m "Update schedule" && git push; fi
